# CI Workflow - 自动运行于所有分支
# 适用于 feature/*, bugfix/*, develop 等分支的自动化检查

name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

# 最小权限原则
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
