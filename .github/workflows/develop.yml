# Develop Branch Workflow - 自动部署到开发/测试环境
# 当代码合并到 develop 分支时自动触发

name: Develop Branch - Auto Deploy to Dev

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: dist/
          retention-days: 14

  deploy-dev:
    name: Deploy to Development
    needs: build
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dev-build
          path: dist/

      - name: Deploy to Development Environment
        run: |
          echo "🚀 Deploying to Development Environment..."
          echo "Artifact downloaded to dist/"
          # 在这里添加你的部署脚本
          # 例如: AWS S3, Azure Blob, FTP, SSH 等
          echo "✅ Deployment to Development completed!"
